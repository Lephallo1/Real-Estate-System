{% if table.columns %}
  <div class="data-table-wrap">
    <table class="data-table">
      <thead><tr>{% for column in table.columns %}<th>{{ column }}</th>{% endfor %}</tr></thead>
      <tbody>
        {% for row in table.rows %}
          <tr>{% for column in table.columns %}<td>{{ row[column] }}</td>{% endfor %}</tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
{% else %}
  <p>No rows are available for this table yet.</p>
{% endif %}
