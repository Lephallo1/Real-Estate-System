{% extends "base.html" %}

{% block content %}
<section class="auth-card-wrap">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="auth-brand-icon">&#127968;</div>
      <div>
        <h2>LesothoHomeAI</h2>
        <p>Customer registration</p>
      </div>
    </div>

    <div class="auth-caption">Customer Onboarding</div>
    <h3>Create your account</h3>

    <form method="post" class="auth-form">
      <label>Full name</label>
      <input type="text" name="full_name" value="{{ request.form.get('full_name', '') }}" placeholder="Your full name" required>

      <label>Email address</label>
      <input type="email" name="email" value="{{ request.form.get('email', '') }}" placeholder="you@example.com" required>

      <label>Address</label>
      <input type="text" name="address" value="{{ request.form.get('address', '') }}" placeholder="District, town, or home address" required>

      <label>Password</label>
      <input type="password" name="password" placeholder="Create a password" required>

      <label>Confirm password</label>
      <input type="password" name="confirm_password" placeholder="Repeat your password" required>

      <button type="submit" class="primary-btn full">CREATE CUSTOMER ACCOUNT</button>
    </form>

    <div class="auth-secondary">
      <p>Already registered?</p>
      <a class="secondary-btn full" href="{{ url_for('auth.login') }}">Back to sign in</a>
    </div>

    {% if not setup_ok %}
      <details class="accordion">
        <summary>MySQL setup help</summary>
        <div class="accordion-body">
          <p>Database login is not configured yet.</p>
          <code>{{ setup_message }}</code>
        </div>
      </details>
    {% endif %}
  </div>
</section>
{% endblock %}
